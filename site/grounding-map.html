<!doctype html>
<!--
  The grounding map on its own page. The front page (index.html) shows it in a frame,
  and it can also be opened alone.

  It draws nopekit's live map: lib/map.js reads data/map.json and data/page.json,
  which `nopekit site build` bakes from the records and the verdicts on every build.
  This file holds only the frame around the map. It sets no status, number or word.
  The script follows page.js's map section (legend, caption, amber chip, controls,
  drawer, live rebuilds). page.js itself also loads three.js and the 3D model.
  `site build` refreshes lib/, page.css and map.css, and never touches this file.

  What slipped through before it: this page was a self-contained copy of the
  v0.1 map, frozen on 2026-10-08, with its data in the file. It kept showing v0.1
  (ducts, "no supports", 45.1 g) after the design moved on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PETGasus grounding map</title>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="map.css">
<style>
  main { max-width: none; margin: 0; padding: 4px 12px 8px; }
  .map-sec { margin: 0; }
  .mapframe { width: auto; margin: 6px 0 4px; transform: none; }
  /* In the front page's frame, the page is as tall as the map. The host gives the
     part of the frame on screen (--vis-top, --vis-bottom), and the drawer stays there. */
  #nk-drawer { top: var(--vis-top, 0px); bottom: var(--vis-bottom, 0px); }
  .build-banner { margin: 6px 0; }
</style>
</head>
<body>
<p class="build-banner" id="build-banner" role="status" hidden></p>
<main>
  <section class="map-sec" id="map">
    <div class="maptools">
      <p class="cap cap-desk">Each line is one claim. It goes through the shared values that its evaluators read. It ends on its board.</p>
      <p class="cap cap-phone">Each card is one claim, on its board. Tap a card to see its evidence.</p>
      <div class="legend" id="map-legend"></div>
      <div class="mapctl" role="toolbar" aria-label="Map controls">
        <button class="chip" id="map-worst" type="button" aria-pressed="false" title="Put the worst claims first on each board">Worst first</button>
        <button class="iconbtn" id="map-out" type="button" aria-label="Zoom out">−</button>
        <button class="iconbtn" id="map-in" type="button" aria-label="Zoom in">+</button>
        <button class="iconbtn" id="map-fit" type="button" aria-label="Show the whole map" title="Show the whole map (key 0)">⤢</button>
      </div>
    </div>
    <div class="mapframe" id="map-host"><p class="muted" style="padding:16px">Reading the map.</p></div>
  </section>
</main>
<script type="module">
import { el, mount, $ } from "./lib/dom.js";
import { lookOf } from "./lib/format.js";
import { renderMap, mapList } from "./lib/map.js";
import { createDrawer } from "./lib/drawer.js";
import { readBuild, watchBuild } from "./lib/live.js";

const PHONE = matchMedia("(max-width: 759px)");
// lit: the legend's pressed chips (tokens, or the amber mark), put back after every redraw (nopekit#18)
const page = { doc: null, map: null, build: null, drawer: null, mapApi: null, worstFirst: false,
  lit: { tokens: new Set(), mark: "" } };

// In the front page's frame, a link to another page (the drawer's "technical record") opens in the whole
// window, not inside the frame.
if (window.top !== window) document.addEventListener("click", ev => {
  const a = ev.target.closest && ev.target.closest("a[href]");
  if (a && !a.target && !a.getAttribute("href").startsWith("#")) a.target = "_top";
}, true);

const fetchJson = async url => {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url}: ${res.status} ${res.statusText}`);
  return res.json();
};
const read = () => Promise.all(["data/page.json", "data/map.json"].map(fetchJson));

try {
  [page.doc, page.map] = await read();
} catch (err) {
  mount($("#map-host"), el("p", { class: "muted", style: "padding:16px",
    text: `The map has no data. Run nopekit site build. (${err.message || err})` }));
  throw err;
}
page.build = await readBuild();
render();
watchBuild(async build => {
  try { [page.doc, page.map] = await read(); } catch (err) { return; }   // the next poll tries again
  page.build = build;
  render();
}, showBuild, page.build);

function render() {
  const words = page.doc.words || {};
  if (!page.drawer) {
    page.drawer = createDrawer(page.doc, page.map, { onChange: (kind, key) => {
      if (!page.mapApi || !page.mapApi.select) return;
      if (kind) page.mapApi.select(kind, key); else page.mapApi.clear();
    } });
    document.body.appendChild(page.drawer.element);
  } else {
    page.drawer.update(page.doc, page.map);
  }
  mount($("#map-legend"), ...legend(page.map, words));
  caption(page.map, words);
  drawMap();
}

// the legend: one chip for each token on the map, which lights its lines, then amber
function legend(map, words) {
  const tokens = words.tokens || {};
  const on = page.lit.tokens;
  const chips = (map.legend || []).map(item => {
    const look = lookOf(item.token), said = tokens[item.token] || {};
    const button = el("button", { class: "lgf", type: "button", "aria-pressed": String(on.has(item.token)), title: said.hint || "",
      onclick: () => {
        if (on.has(item.token)) on.delete(item.token); else on.add(item.token);
        button.setAttribute("aria-pressed", String(on.has(item.token)));
        showLit();
      } },
      lineSample(look),
      el("span", { class: `nk-glyph tone-${look.tone}`, "aria-hidden": "true", text: look.glyph }),
      el("span", { text: said.word || item.token }),
      el("span", { class: "lg-n", text: String(item.n) }));
    return button;
  });
  const marked = (map.lines || []).filter(l => (l.marks || []).includes("amber")).length;
  const amberSaid = (words.trace || {}).amber_legend || "";
  if (marked && amberSaid) {
    const button = el("button", { class: "lgf lg-amber", type: "button", "aria-pressed": String(page.lit.mark === "amber"),
      onclick: () => {
        page.lit.mark = page.lit.mark === "amber" ? "" : "amber";
        button.setAttribute("aria-pressed", String(page.lit.mark === "amber"));
        showLit();
      } },
      el("span", { class: "lg-amber-band", "aria-hidden": "true" }),
      el("span", { text: amberSaid }),
      el("span", { class: "lg-n", text: String(marked) }));
    chips.push(button);
  }
  return chips;
}

function showLit() {
  if (page.mapApi && page.mapApi.showTokens) page.mapApi.showTokens(page.lit.tokens.size ? page.lit.tokens : null, page.lit.mark);
}

function lineSample(look) {
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg");
  s.setAttribute("width", "26"); s.setAttribute("height", "10"); s.setAttribute("aria-hidden", "true");
  s.setAttribute("class", "lg-line");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", "M2,5 H24");
  p.setAttribute("class", `track tk-${look.stroke || "dotted"} tone-${look.tone}`);
  s.appendChild(p);
  return s;
}

// the caption over the drawing, and the trace's note under it (all baked words)
function caption(map, words) {
  const trace = (map && map.trace) || {}, said = words.trace || {};
  const desk = $(".maptools .cap-desk");
  if (said.caption) mount(desk, `${said.caption} Point at a line, a station or a group to show its links. Click one to see its evidence.`);
  let note = $(".maptools .trace-note");
  if (!note) { note = el("p", { class: "cap trace-note" }); desk.after(note); }
  const running = page.build && page.build.tracing && said.running ? said.running : "";
  mount(note, [trace.notice, trace.text, running].filter(Boolean).join(" "));
}

function drawMap() {
  const host = $("#map-host");
  const keep = page.mapApi && page.mapApi.view;
  if (page.mapApi && page.mapApi.destroy) page.mapApi.destroy();
  page.mapApi = null;
  const onSelect = (kind, key) => page.drawer.open(kind, key);
  const onBoard = key => page.drawer.open("board", key);
  document.body.classList.toggle("map-phone", PHONE.matches);
  if (PHONE.matches) { mount(host, mapList(page.map, page.doc, { onSelect, onBoard })); return; }
  page.mapApi = renderMap(host, page.map, page.doc, { onSelect, onBoard, worstFirst: page.worstFirst,
    onRescale: () => drawMap() });
  if (keep) page.mapApi.view = keep;
  const current = page.drawer && page.drawer.current;
  if (current) page.mapApi.select(current[0], current[1]);
  else showLit();
}
PHONE.addEventListener("change", () => { if (page.map) drawMap(); });
// the map's own hover clears a legend filter (nopekit#18): put it back when the pointer leaves the map
$("#map-host").addEventListener("mouseleave", () => { if (!(page.drawer && page.drawer.current)) showLit(); });

$("#map-worst").addEventListener("click", ev => {
  page.worstFirst = !page.worstFirst;
  ev.currentTarget.setAttribute("aria-pressed", String(page.worstFirst));
  drawMap();
});
$("#map-in").addEventListener("click", () => page.mapApi && page.mapApi.zoomIn());
$("#map-out").addEventListener("click", () => page.mapApi && page.mapApi.zoomOut());
$("#map-fit").addEventListener("click", () => page.mapApi && page.mapApi.reset());

// a failed rebuild shows its last line over the map; the caption follows a running trace
function showBuild(build) {
  const banner = $("#build-banner"), notices = ((page.doc && page.doc.words) || {}).notices || {};
  if (build && build.ok === false) {
    mount(banner, el("span", { class: "nk-glyph", "aria-hidden": "true", text: "!" }),
      el("span", { text: notices.build_failed || "" }),
      build.error ? el("code", { class: "mono", text: String(build.error) }) : null);
    banner.hidden = false;
  } else {
    banner.hidden = true;
  }
  if (page.map && page.doc) caption(page.map, page.doc.words || {});
}

// #claim=C1 (or requirement=, zone=, station=, board=) opens that drawer
{
  const m = decodeURIComponent(location.hash.replace(/^#/, "")).match(/^(claim|requirement|zone|station|board)=(.+)$/);
  if (m) page.drawer.open(m[1], m[2]);
}
</script>
</body>
</html>
